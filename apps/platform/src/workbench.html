<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="CoBuild 工作台">
  <title>CoBuild 工作台</title>
  <style>/* WORKBENCH_CSS */</style>
</head>
<body class="cb-shell">
  <a class="skip-link" href="#cb-content">跳到主要内容</a>
  <div class="cb-layout">
    <aside class="cb-sidebar" aria-label="主导航">
      <div class="cb-brand-row">
        <a class="brand" href="/workbench" data-cb-view="home" aria-label="CoBuild 工作台"><img src="/assets/cobuild/cobuild-wordmark.svg" alt="CoBuild"><span class="brand-product visually-hidden">工作台</span></a>
        <button id="cb-collapse" class="cb-icon-button" type="button" aria-label="收起侧栏" aria-expanded="true"><img src="/assets/icons/layout-sidebar-left-collapse.svg" alt=""></button>
      </div>
      <nav class="cb-primary-nav" aria-label="页面">
        <a id="cb-nav-home" aria-label="工作台" title="工作台" class="cb-nav-link" href="/workbench" data-cb-view="home"><img src="/assets/icons/home.svg" alt=""><span>工作台</span></a>
        <a id="cb-nav-projects" aria-label="项目" title="项目" class="cb-nav-link" href="/projects"><img src="/assets/cobuild/kick.png" alt=""><span>项目</span></a>
        <a id="cb-nav-apps" aria-label="应用" title="应用" class="cb-nav-link" href="/workbench#apps" data-cb-view="apps"><img src="/assets/icons/apps.svg" alt=""><span>应用</span></a>
      </nav>
      <section class="cb-favorites" aria-labelledby="cb-favorites-title">
        <h2 id="cb-favorites-title"><img src="/assets/icons/star.svg" alt="收藏"><span>收藏</span></h2>
        <ul id="cb-favorites-list"></ul>
        <p id="cb-favorites-empty">在应用页收藏常用应用</p>
        <p id="cb-favorites-status" role="status" hidden></p>
        <button id="cb-favorites-retry" class="cb-favorites-retry" type="button" hidden>重试</button>
      </section>
      <div class="cb-sidebar-bottom">
        <details id="cb-user-menu">
          <summary><span class="cb-avatar" id="cb-avatar" aria-hidden="true">C</span><span id="cb-user-name">未登录</span><img class="cb-user-chevron" src="/assets/icons/chevron-down.svg" alt=""></summary>
          <div id="cb-user-actions">
          </div>
        </details>
      </div>
    </aside>
    <main class="shell cb-main" id="cb-content">
      <header class="masthead cb-header"><div class="masthead-inner">
        <h1 id="cb-page-title">工作台</h1>
        <form class="search" id="app-search-form" role="search" action="#">
          <label class="visually-hidden" for="app-search">搜索应用</label>
          <div class="search-control"><img src="/assets/icons/search.svg" alt=""><input id="app-search" type="search" name="q" placeholder="搜索应用" autocomplete="off" aria-controls="app-grid" aria-describedby="app-count"><button id="app-search-clear" type="button" hidden aria-label="清除搜索"><img src="/assets/icons/x.svg" alt=""></button></div>
        </form>
      </div></header>
      <section id="cb-update-notice" class="cb-update-notice" role="status" aria-live="polite" aria-label="更新提醒" hidden>
        <span id="cb-update-message"></span>
        <div class="cb-update-actions">
          <button id="cb-update-refresh" type="button" hidden>刷新工作台</button>
          <a id="plugin-update-install" href="https://internal.110-lab.cn/plugin-update" target="_blank" rel="noopener noreferrer" hidden>更新插件</a>
          <button id="cb-update-dismiss" class="cb-icon-button" type="button" aria-label="稍后提醒"><img src="/assets/icons/x.svg" alt=""></button>
        </div>
      </section>
      <section id="cb-home-apps" class="cb-quick" aria-labelledby="cb-quick-title"><div class="cb-section-heading"><h2 id="cb-quick-title">常用应用</h2><a href="/workbench#apps" data-cb-view="apps">全部应用 <img src="/assets/icons/arrow-right.svg" alt=""></a></div><ul id="cb-quick-list"></ul></section>
      <!-- WORKSPACE -->
      <section class="region cb-apps-region" id="apps" aria-labelledby="apps-title" hidden>
        <div class="cb-section-heading"><h2 id="apps-title">全部应用</h2><p id="app-count" role="status" aria-live="polite"></p></div>
        <div id="cb-app-filters" class="cb-tabs" role="group" aria-label="应用分类"><button type="button" data-app-category="all" aria-pressed="true">全部</button><button type="button" data-app-category="collaboration" aria-pressed="false">协作</button><button type="button" data-app-category="management" aria-pressed="false">管理</button><button type="button" data-app-category="teaching" aria-pressed="false">产品</button></div>
        <ul class="app-grid" id="app-grid" aria-label="应用列表"></ul>
        <p class="empty-state" id="app-empty" hidden>没有匹配的应用。</p>
        <noscript>需要启用 JavaScript 才能使用工作台。</noscript>
      </section>
    </main>
  </div>
  <footer class="wb-footer" hidden></footer>
  <div class="link-message" id="link-message" role="status" aria-live="assertive" hidden></div>
  <script type="module">/* WORKBENCH_SCRIPT */</script>
</body>
</html>
